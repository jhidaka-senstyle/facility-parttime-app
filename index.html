<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>施設間バイト募集</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .guide {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 16px; font-weight: 500; }
    p { color: #5f6368; margin-bottom: 12px; line-height: 1.6; }
    .links { margin-top: 24px; text-align: left; }
    .links h2 { font-size: 15px; margin-bottom: 12px; color: #202124; }
    .links ul { list-style: none; }
    .links li {
      padding: 10px 0;
      border-bottom: 1px solid #e8eaed;
      font-size: 14px;
    }
    .links li:last-child { border-bottom: none; }
    code {
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="guide">
    <h1>施設間バイト募集</h1>
    <p>このアプリにアクセスするには、URLパラメータが必要です。</p>
    <div class="links">
      <h2>アクセス方法</h2>
      <ul>
        <li><strong>管理者画面：</strong><br><code>?page=admin</code></li>
        <li><strong>スタッフ画面（長嶺）：</strong><br><code>?facility=NAGAMINE</code></li>
        <li><strong>スタッフ画面（京町台）：</strong><br><code>?facility=KYOMACHIDAI</code></li>
        <li><strong>スタッフ画面（花園）：</strong><br><code>?facility=HANAZONO</code></li>
      </ul>
    </div>
    <p style="margin-top:20px;font-size:13px;">スタッフの方は各施設のQRコードからアクセスしてください。</p>
  </div>
</body>
</html>
