<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>施設間バイト募集</title>
  <?!= include('staff.css'); ?>
</head>
<body>
  <header class="staff-header">
    <h1>施設間バイト募集</h1>
    <p class="facility-label">所属施設：<strong id="facilityName">-</strong></p>
  </header>

  <main class="staff-main">
    <div id="loading" class="loading">読み込み中...</div>
    <div id="errorView" class="error-view" hidden></div>
    <div id="slotsContainer" class="slots-container" hidden></div>
    <div id="emptyView" class="empty-view" hidden>
      <p>現在、応募可能な募集はありません。</p>
    </div>
  </main>

  <!-- 応募フォーム -->
  <div class="modal-overlay" id="applyModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>応募する</h2>
        <button type="button" class="modal-close" id="closeApplyModal">&times;</button>
      </div>
      <div class="slot-summary" id="applySlotSummary"></div>
      <form id="applyForm">
        <input type="hidden" id="applySlotId">
        <div class="form-group">
          <label for="applyName">氏名</label>
          <input type="text" id="applyName" name="name" required placeholder="山田 太郎">
        </div>
        <div class="form-group">
          <label for="applyJobType">職種</label>
          <select id="applyJobType" name="jobType" required></select>
        </div>
        <div class="form-group">
          <label for="applyEmail">メールアドレス</label>
          <input type="email" id="applyEmail" name="email" required placeholder="example@senstyle.co.jp">
        </div>
        <div class="form-group" id="preferredShiftGroup" hidden>
          <label for="applyPreferredShift">希望する勤務時間</label>
          <select id="applyPreferredShift" name="preferredShift">
            <option value="FULLDAY">募集どおり終日勤務（8:30-17:30）</option>
            <option value="AM">午前のみ希望（8:30-12:30）</option>
            <option value="PM">午後のみ希望（13:30-17:30）</option>
          </select>
        </div>
        <div class="form-group">
          <label for="applyRemarks">備考（任意）</label>
          <textarea id="applyRemarks" name="remarks" rows="3" maxlength="200" placeholder="例：17:00まで勤務可能です"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">応募する</button>
      </form>
    </div>
  </div>

  <!-- 完了画面 -->
  <div class="modal-overlay" id="successModal" hidden>
    <div class="modal modal-success">
      <div class="success-icon">✓</div>
      <h2>応募完了</h2>
      <p id="successMessage">応募を受け付けました。</p>
      <button type="button" class="btn btn-primary btn-block" id="btnSuccessClose">OK</button>
    </div>
  </div>

  <script>
    var STAFF_FACILITY_CODE = '<?= facilityCode ?>';
  </script>
  <?!= include('staff.js'); ?>
</body>
</html>
