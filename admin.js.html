<script>
(function () {
  var currentFacility = 'KYOMACHIDAI';
  var initData = null;
  var calendar = null;
  var currentSlotId = null;
  var calendarEl = null;
  var viewMode = 'month';
  var cardAnchorDate = null;
  var cachedEvents = [];
  var WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
  var SHIFT_SORT_ORDER = {
    '終日勤務': 1,
    '午前のみ': 2,
    '午後のみ': 3
  };

  document.addEventListener('DOMContentLoaded', init);

  function init() {
    bindModalClose();
    document.getElementById('createForm').addEventListener('submit', onCreateSubmit);
    document.getElementById('btnShowApplications').addEventListener('click', showAllApplications);
    document.getElementById('btnDeleteSlot').addEventListener('click', onDeleteSlot);

    google.script.run
      .withSuccessHandler(onInitSuccess)
      .withFailureHandler(showError)
      .apiGetAdminInitData();
  }

  function onInitSuccess(result) {
    initData = result.data;
    currentFacility = initData.defaultFacility;
    renderFacilityTabs();
    populateCreateFormOptions();
    initCalendar();
    updateFacilityLabel();
  }

  function renderFacilityTabs() {
    var container = document.getElementById('facilityTabs');
    container.innerHTML = '';
    initData.facilities.forEach(function (f) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'facility-tab' + (f.code === currentFacility ? ' active' : '');
      btn.textContent = f.name;
      btn.dataset.code = f.code;
      btn.addEventListener('click', function () {
        switchFacility(f.code);
      });
      container.appendChild(btn);
    });
  }

  function switchFacility(code) {
    currentFacility = code;
    cachedEvents = [];
    document.querySelectorAll('.facility-tab').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.code === code);
    });
    updateFacilityLabel();
    if (calendar) {
      refreshCalendar();
    }
  }

  function updateFacilityLabel() {
    var facility = initData.facilities.find(function (f) {
      return f.code === currentFacility;
    });
    var name = facility ? facility.name : '';
    document.getElementById('currentFacilityLabel').textContent = name;
    document.getElementById('createTargetFacility').textContent = name;
  }

  function populateCreateFormOptions() {
    var shiftSelect = document.getElementById('createShiftType');
    shiftSelect.innerHTML = '';
    initData.shiftTypes.forEach(function (label) {
      var opt = document.createElement('option');
      opt.value = label;
      opt.textContent = label;
      shiftSelect.appendChild(opt);
    });

    var jobSelect = document.getElementById('createJobCondition');
    jobSelect.innerHTML = '';
    initData.jobConditions.forEach(function (cond) {
      var opt = document.createElement('option');
      opt.value = cond;
      opt.textContent = cond;
      jobSelect.appendChild(opt);
    });
  }

  function initCalendar() {
    calendarEl = document.getElementById('calendar');
    calendar = new FullCalendar.Calendar(calendarEl, {
      locale: 'ja',
      initialView: 'dayGridMonth',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,cardWeek,cardDay'
      },
      customButtons: {
        cardWeek: {
          text: 'week',
          click: function () {
            setViewMode('week');
          }
        },
        cardDay: {
          text: 'day',
          click: function () {
            setViewMode('day');
          }
        }
      },
      height: 'auto',
      selectable: false,
      eventSources: [{
        id: 'admin-slots',
        events: fetchEvents
      }],
      eventContent: renderEventContent,
      eventDidMount: applyEventColors,
      dateClick: function (info) {
        if (viewMode !== 'month') return;
        openCreateModal(info.dateStr);
      },
      eventClick: function (info) {
        if (viewMode !== 'month') return;
        openDetailModal(info.event.extendedProps.slotId);
      },
      datesSet: function (info) {
        if (viewMode === 'month') {
          cardAnchorDate = startOfDay(info.view.currentStart);
        }
      }
    });
    calendar.render();
    bindCardViewNavigation();
    bindMonthViewButton();
  }

  function bindMonthViewButton() {
    var monthBtn = calendarEl.querySelector('.fc-dayGridMonth-button');
    if (monthBtn) {
      monthBtn.addEventListener('click', function () {
        setViewMode('month');
      });
    }
  }

  function bindCardViewNavigation() {
    calendarEl.addEventListener('click', function (e) {
      if (viewMode === 'month') return;
      var btn = e.target.closest('.fc-prev-button, .fc-next-button, .fc-today-button');
      if (!btn) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (btn.classList.contains('fc-prev-button')) {
        navigateCardView(-1);
      } else if (btn.classList.contains('fc-next-button')) {
        navigateCardView(1);
      } else if (btn.classList.contains('fc-today-button')) {
        cardAnchorDate = startOfDay(new Date());
        loadAndRenderCardView();
      }
    }, true);
  }

  function setViewMode(mode) {
    viewMode = mode;
    var panel = document.getElementById('cardCalendarPanel');
    var harness = calendarEl.querySelector('.fc-view-harness');

    if (mode === 'month') {
      panel.hidden = true;
      if (harness) harness.style.display = '';
      calendar.changeView('dayGridMonth');
    } else {
      cardAnchorDate = startOfDay(calendar.getDate());
      if (harness) harness.style.display = 'none';
      panel.hidden = false;
      loadAndRenderCardView();
    }
    updateViewButtonStates();
  }

  function updateViewButtonStates() {
    var monthBtn = calendarEl.querySelector('.fc-dayGridMonth-button');
    var weekBtn = calendarEl.querySelector('.fc-cardWeek-button');
    var dayBtn = calendarEl.querySelector('.fc-cardDay-button');
    [monthBtn, weekBtn, dayBtn].forEach(function (btn) {
      if (btn) btn.classList.remove('fc-button-active');
    });
    if (viewMode === 'month' && monthBtn) {
      monthBtn.classList.add('fc-button-active');
    } else if (viewMode === 'week' && weekBtn) {
      weekBtn.classList.add('fc-button-active');
    } else if (viewMode === 'day' && dayBtn) {
      dayBtn.classList.add('fc-button-active');
    }
  }

  function navigateCardView(delta) {
    if (!cardAnchorDate) {
      cardAnchorDate = startOfDay(new Date());
    }
    if (viewMode === 'week') {
      cardAnchorDate.setDate(cardAnchorDate.getDate() + delta * 7);
    } else if (viewMode === 'day') {
      cardAnchorDate.setDate(cardAnchorDate.getDate() + delta);
    }
    loadAndRenderCardView();
  }

  function loadAndRenderCardView() {
    var range = getCardViewRange();
    ensureEventsForRange(range.start, range.end, function () {
      renderCardView();
      updateCardToolbarTitle();
    });
  }

  function getCardViewRange() {
    if (viewMode === 'day') {
      var dayStart = startOfDay(cardAnchorDate);
      var dayEnd = new Date(dayStart);
      dayEnd.setDate(dayStart.getDate() + 1);
      return { start: dayStart, end: dayEnd };
    }
    var weekStart = getWeekStart(cardAnchorDate);
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 7);
    return { start: weekStart, end: weekEnd };
  }

  function ensureEventsForRange(startDate, endDate, callback) {
    var startStr = toDateKey(startDate);
    var endStr = toDateKey(endDate);
    if (isRangeCovered(startStr, endStr)) {
      callback();
      return;
    }
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          mergeCachedEvents(result.data);
          markRangeCached(startStr, endStr);
          callback();
        } else {
          showError(result.message);
        }
      })
      .withFailureHandler(showError)
      .apiGetAdminCalendarEvents(currentFacility, startStr, endStr);
  }

  var cachedRanges = [];

  function isRangeCovered(startStr, endStr) {
    return cachedRanges.some(function (range) {
      return range.start <= startStr && range.end >= endStr;
    });
  }

  function markRangeCached(startStr, endStr) {
    cachedRanges.push({ start: startStr, end: endStr });
  }

  function mergeCachedEvents(events) {
    events.forEach(function (ev) {
      var idx = cachedEvents.findIndex(function (item) {
        return item.id === ev.id;
      });
      if (idx >= 0) {
        cachedEvents[idx] = ev;
      } else {
        cachedEvents.push(ev);
      }
    });
  }

  function getEventsForDate(date) {
    var key = toDateKey(date);
    return cachedEvents.filter(function (ev) {
      return getEventDateKey(ev) === key;
    }).sort(compareEventsByShift);
  }

  function getEventDateKey(event) {
    if (typeof event.start === 'string') {
      return event.start.substring(0, 10);
    }
    if (event.start instanceof Date) {
      return toDateKey(event.start);
    }
    return String(event.start || '').substring(0, 10);
  }

  function compareEventsByShift(a, b) {
    var orderA = SHIFT_SORT_ORDER[(a.extendedProps && a.extendedProps.shiftType) || ''] || 99;
    var orderB = SHIFT_SORT_ORDER[(b.extendedProps && b.extendedProps.shiftType) || ''] || 99;
    if (orderA !== orderB) return orderA - orderB;
    return String(a.id).localeCompare(String(b.id));
  }

  function renderCardView() {
    var panel = document.getElementById('cardCalendarPanel');
    if (viewMode === 'week') {
      panel.innerHTML = renderWeekCardView();
    } else if (viewMode === 'day') {
      panel.innerHTML = renderDayCardView();
    }
    bindCardClicks(panel);
  }

  function renderWeekCardView() {
    var weekStart = getWeekStart(cardAnchorDate);
    var todayKey = toDateKey(new Date());
    var html = '<div class="card-calendar-week">';

    for (var i = 0; i < 7; i++) {
      var day = new Date(weekStart);
      day.setDate(weekStart.getDate() + i);
      var dayKey = toDateKey(day);
      var events = getEventsForDate(day);
      var isToday = dayKey === todayKey;

      html += '<div class="card-calendar-column">';
      html += '<div class="card-calendar-column-header' + (isToday ? ' is-today' : '') + '">' +
        escapeHtml(formatShortDate(day)) + '</div>';
      html += '<div class="card-calendar-column-body">';
      if (events.length) {
        html += events.map(renderSlotCard).join('');
      } else {
        html += '<div class="card-calendar-empty">—</div>';
      }
      html += '</div></div>';
    }

    html += '</div>';
    return html;
  }

  function renderDayCardView() {
    var day = startOfDay(cardAnchorDate);
    var todayKey = toDateKey(new Date());
    var isToday = toDateKey(day) === todayKey;
    var events = getEventsForDate(day);
    var html = '<div class="card-calendar-day">';
    html += '<div class="card-calendar-day-header' + (isToday ? ' is-today' : '') + '">' +
      escapeHtml(formatDayTitle(day)) + '</div>';
    html += '<div class="card-calendar-day-body">';

    if (events.length) {
      html += events.map(renderSlotCard).join('');
    } else {
      html += '<div class="card-calendar-empty">この日の募集・勤務はありません</div>';
    }

    html += '</div></div>';
    return html;
  }

  function renderSlotCard(event) {
    var props = event.extendedProps || {};
    var state = props.displayState || 'available';
    var lines = [];
    var preferred = extractPreferredShiftDisplay(props);

    lines.push('<div class="slot-card-shift">' + escapeHtml(props.shiftType || '') + '</div>');

    if (state === 'approved') {
      if (props.applicantName) {
        lines.push('<div class="slot-card-name">' + escapeHtml(props.applicantName) + '</div>');
      }
      lines.push('<div class="slot-card-status">承認済</div>');
    } else if (state === 'tentative') {
      lines.push('<div class="slot-card-status">仮押さえ ' + escapeHtml(props.applicantName || '') + '</div>');
      if (preferred) {
        lines.push('<div class="slot-card-preferred">' + escapeHtml(preferred) + '</div>');
      }
    } else if (state === 'available') {
      lines.push('<div class="slot-card-status">募集中</div>');
      if (props.jobCondition === '看護師') {
        lines.push('<div class="slot-card-tag">看護師</div>');
      }
    } else if (state === 'inactive') {
      lines.push('<div class="slot-card-status">停止</div>');
    }

    return (
      '<button type="button" class="slot-card slot-card-' + escapeHtml(state) + '" ' +
      'data-slot-id="' + escapeHtml(props.slotId || event.id) + '">' +
      lines.join('') +
      '</button>'
    );
  }

  function extractPreferredShiftDisplay(props) {
    var title = props.shortTitle || props.longTitle || '';
    if (title.indexOf('午前希望') !== -1) return '希望：午前のみ';
    if (title.indexOf('午後希望') !== -1) return '希望：午後のみ';
    return '';
  }

  function bindCardClicks(container) {
    container.querySelectorAll('.slot-card[data-slot-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openDetailModal(btn.dataset.slotId);
      });
    });
  }

  function updateCardToolbarTitle() {
    var titleEl = calendarEl.querySelector('.fc-toolbar-title');
    if (!titleEl || viewMode === 'month') return;

    if (viewMode === 'week') {
      var weekStart = getWeekStart(cardAnchorDate);
      var weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      titleEl.textContent = formatWeekRangeTitle(weekStart, weekEnd);
    } else if (viewMode === 'day') {
      titleEl.textContent = formatDayTitle(startOfDay(cardAnchorDate));
    }
  }

  function startOfDay(date) {
    var d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function getWeekStart(date) {
    var d = startOfDay(date);
    var day = d.getDay();
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function toDateKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function formatShortDate(date) {
    return (date.getMonth() + 1) + '/' + date.getDate() + '(' + WEEKDAYS[date.getDay()] + ')';
  }

  function formatDayTitle(date) {
    return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() +
      '日（' + WEEKDAYS[date.getDay()] + '）';
  }

  function formatWeekRangeTitle(start, end) {
    var startText = start.getFullYear() + '年' + (start.getMonth() + 1) + '月' + start.getDate() + '日';
    var endText;
    if (start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth()) {
      endText = end.getDate() + '日';
    } else if (start.getFullYear() === end.getFullYear()) {
      endText = (end.getMonth() + 1) + '月' + end.getDate() + '日';
    } else {
      endText = end.getFullYear() + '年' + (end.getMonth() + 1) + '月' + end.getDate() + '日';
    }
    return startText + ' - ' + endText;
  }

  function applyEventColors(info) {
    var props = info.event.extendedProps;
    var bg = props.backgroundColor || info.event.backgroundColor;
    var border = props.borderColor || info.event.borderColor;
    var color = props.textColor || info.event.textColor;

    if (bg) {
      info.el.style.backgroundColor = bg;
      info.el.style.setProperty('--fc-event-bg-color', bg);
    }
    if (border) {
      info.el.style.borderColor = border;
      info.el.style.setProperty('--fc-event-border-color', border);
    }
    if (color) {
      info.el.style.color = color;
      info.el.style.setProperty('--fc-event-text-color', color);
    }

    if (props.displayState) {
      info.el.setAttribute('data-display-state', props.displayState);
      info.el.classList.add('fc-slot-' + props.displayState);
    }

    info.el.querySelectorAll('.fc-event-main, .fc-event-title, .fc-slot-event-text').forEach(function (node) {
      if (color) {
        node.style.color = color;
      }
    });
  }

  function renderEventContent(arg) {
    var props = arg.event.extendedProps;
    var isMonthView = arg.view.type === 'dayGridMonth';
    var title = isMonthView
      ? (props.shortTitle || arg.event.title)
      : (props.longTitle || arg.event.title);
    var stateClass = props.displayState ? 'fc-slot-' + props.displayState : '';
    var textColor = props.textColor || arg.event.textColor || 'inherit';

    return {
      html: '<div class="fc-event-main fc-event-title fc-slot-event-text ' + stateClass + '" ' +
        'style="color:' + escapeHtml(textColor) + ' !important;">' +
        escapeHtml(title) +
        '</div>'
    };
  }

  function fetchEvents(info, successCallback, failureCallback) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          mergeCachedEvents(result.data);
          markRangeCached(info.startStr.substring(0, 10), info.endStr.substring(0, 10));
          successCallback(result.data);
          if (viewMode !== 'month') {
            renderCardView();
            updateCardToolbarTitle();
          }
        } else {
          failureCallback(new Error(result.message));
          showError(result.message);
        }
      })
      .withFailureHandler(function (err) {
        failureCallback(err);
        showError(err.message);
      })
      .apiGetAdminCalendarEvents(currentFacility, info.startStr, info.endStr);
  }

  /**
   * カレンダーを最新状態へ再取得する。
   * removeAllEvents で表示中イベントをクリアしてから refetch し、
   * 承認後の半日枠自動生成などを確実に反映する。
   */
  function refreshCalendar() {
    if (!calendar) {
      return Promise.resolve();
    }
    cachedEvents = [];
    cachedRanges = [];
    calendar.removeAllEvents();
    return calendar.refetchEvents().then(function () {
      if (viewMode !== 'month') {
        loadAndRenderCardView();
      }
    });
  }

  function openCreateModal(dateStr) {
    document.getElementById('createWorkDate').value = dateStr;
    document.getElementById('createModal').hidden = false;
  }

  function onCreateSubmit(e) {
    e.preventDefault();
    var workDate = document.getElementById('createWorkDate').value;
    var shiftType = document.getElementById('createShiftType').value;
    var jobCondition = document.getElementById('createJobCondition').value;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          closeModal('createModal');
          refreshCalendar().then(function () {
            showToast('募集枠を作成しました', 'success');
          });
        } else {
          showError(result.message);
        }
      })
      .withFailureHandler(showError)
      .apiCreateSlot(currentFacility, workDate, shiftType, jobCondition);
  }

  function openDetailModal(slotId) {
    currentSlotId = slotId;
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          showError(result.message);
          return;
        }
        renderSlotDetail(result.data);
        document.getElementById('detailModal').hidden = false;
      })
      .withFailureHandler(showError)
      .apiGetSlotDetail(slotId);
  }

  function renderSlotDetail(data) {
    var slot = data.slot;
    var stateLabel = getSlotStateLabel(slot.displayState, slot.applicantName);
    var info = document.getElementById('slotDetailInfo');
    info.innerHTML =
      '<p><strong>勤務日：</strong>' + escapeHtml(slot.workDate) + '</p>' +
      '<p><strong>勤務先：</strong>' + escapeHtml(slot.targetFacility) + '</p>' +
      '<p><strong>募集勤務区分：</strong>' + escapeHtml(slot.shiftTypeStaffLabel || slot.shiftType) + '</p>' +
      '<p><strong>職種条件：</strong>' + escapeHtml(slot.jobCondition) + '</p>' +
      '<p><strong>状態：</strong>' + escapeHtml(stateLabel) + '</p>';

    var list = document.getElementById('applicationsList');
    if (!data.applications.length) {
      list.innerHTML = '<p class="empty-message">応募はありません</p>';
    } else {
      list.innerHTML = data.applications.map(function (app) {
        return renderApplicationCard(app, true);
      }).join('');
      bindApplicationActions(list);
    }

    renderSlotDeleteSection(data.canDeleteSlot);
  }

  function renderSlotDeleteSection(canDelete) {
    var errorEl = document.getElementById('slotDeleteError');
    var btn = document.getElementById('btnDeleteSlot');
    if (canDelete) {
      errorEl.hidden = true;
      errorEl.textContent = '';
      btn.disabled = false;
    } else {
      errorEl.textContent = '応募者が存在するため、この募集は削除できません。先に応募処理を行ってください。';
      errorEl.hidden = false;
      btn.disabled = true;
    }
  }

  function onDeleteSlot() {
    if (!currentSlotId) return;

    if (!confirm('この募集を削除しますか？この操作は元に戻せません。')) {
      return;
    }

    var btn = document.getElementById('btnDeleteSlot');
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          currentSlotId = null;
          closeModal('detailModal');
          refreshCalendar().then(function () {
            showToast('募集枠を削除しました', 'success');
          });
        } else {
          btn.disabled = false;
          showError(result.message);
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        showError(err.message);
      })
      .apiDeleteSlot(currentSlotId);
  }

  function showAllApplications() {
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          showError(result.message);
          return;
        }
        var list = document.getElementById('allApplicationsList');
        if (!result.data.length) {
          list.innerHTML = '<p class="empty-message">応募はありません</p>';
        } else {
          list.innerHTML = result.data.map(function (app) {
            return renderApplicationCard(app, false);
          }).join('');
          bindApplicationActions(list);
        }
        document.getElementById('allApplicationsModal').hidden = false;
      })
      .withFailureHandler(showError)
      .apiGetAllApplications();
  }

  function renderApplicationCard(app, showActions) {
    var statusClass = getStatusClass(app.status);
    var actions = '';
    if (showActions && app.status === '承認待ち') {
      actions =
        '<div class="app-card-actions">' +
        '<button type="button" class="btn btn-success btn-sm" data-action="approve" data-id="' + app.applicationId + '">承認</button>' +
        '<button type="button" class="btn btn-warning btn-sm" data-action="reject" data-id="' + app.applicationId + '">否認</button>' +
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete" data-id="' + app.applicationId + '">削除</button>' +
        '</div>';
    } else if (showActions && app.status === '承認済') {
      actions =
        '<div class="app-card-actions">' +
        '<button type="button" class="btn btn-warning btn-sm" data-action="cancel" data-id="' + app.applicationId + '">勤務をキャンセル</button>' +
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete" data-id="' + app.applicationId + '">削除</button>' +
        '</div>';
    } else if (showActions && app.status === '否認') {
      actions =
        '<div class="app-card-actions">' +
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete" data-id="' + app.applicationId + '">削除</button>' +
        '</div>';
    } else if (!showActions && app.status !== '削除') {
      actions =
        '<div class="app-card-actions">' +
        (app.status === '承認待ち'
          ? '<button type="button" class="btn btn-success btn-sm" data-action="approve" data-id="' + app.applicationId + '">承認</button>' +
            '<button type="button" class="btn btn-warning btn-sm" data-action="reject" data-id="' + app.applicationId + '">否認</button>'
          : '') +
        (app.status === '承認済'
          ? '<button type="button" class="btn btn-warning btn-sm" data-action="cancel" data-id="' + app.applicationId + '">勤務をキャンセル</button>'
          : '') +
        '<button type="button" class="btn btn-danger btn-sm" data-action="delete" data-id="' + app.applicationId + '">削除</button>' +
        '</div>';
    }

    return (
      '<div class="app-card">' +
      '<div class="app-card-header">' +
      '<strong>' + escapeHtml(app.name) + '</strong>' +
      '<span class="status-badge ' + statusClass + '">' + escapeHtml(app.status) + '</span>' +
      '</div>' +
      '<p>所属：' + escapeHtml(app.homeFacility) + '　職種：' + escapeHtml(app.jobType) + '</p>' +
      (app.shiftTypeStaffLabel
        ? '<p>募集勤務区分：' + escapeHtml(app.shiftTypeStaffLabel) + '</p>'
        : '<p>勤務日：' + escapeHtml(app.workDate) + ' ' + escapeHtml(app.shiftType) + ' → ' + escapeHtml(app.workFacility) + '</p>') +
      (app.preferredShiftDisplay
        ? '<p>希望勤務区分：' + escapeHtml(app.preferredShiftDisplay) + '</p>'
        : '') +
      '<p>備考：' + escapeHtml(app.remarksDisplay || 'なし') + '</p>' +
      (app.shiftTypeStaffLabel
        ? '<p>勤務日：' + escapeHtml(app.workDate) + ' → ' + escapeHtml(app.workFacility) + '</p>'
        : '') +
      '<p>応募日時：' + escapeHtml(app.appliedAt) + '</p>' +
      actions +
      '</div>'
    );
  }

  function bindApplicationActions(container) {
    container.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.dataset.action;
        var id = btn.dataset.id;

        if (action === 'cancel') {
          if (!confirm('この勤務をキャンセルし、募集枠を再開しますか？')) {
            return;
          }
        }

        var approver = prompt('操作者名（任意）', '管理者');
        if (approver === null) return;

        var apiFn = action === 'approve'
          ? 'apiApproveApplication'
          : action === 'reject'
            ? 'apiRejectApplication'
            : action === 'cancel'
              ? 'apiCancelApprovedApplication'
              : 'apiDeleteApplication';

        google.script.run
          .withSuccessHandler(function (result) {
            if (result.success) {
              showToast('処理が完了しました', 'success');
              var slotIdForDetail = currentSlotId;
              var shouldRefreshAllApps = !document.getElementById('allApplicationsModal').hidden;

              refreshCalendar().then(function () {
                if (slotIdForDetail) {
                  openDetailModal(slotIdForDetail);
                }
                if (shouldRefreshAllApps) {
                  showAllApplications();
                }
              });
            } else {
              showError(result.message);
            }
          })
          .withFailureHandler(showError)
          [apiFn](id, approver);
      });
    });
  }

  function getSlotStateLabel(displayState, applicantName) {
    switch (displayState) {
      case 'available': return '募集中';
      case 'tentative': return '仮押さえ（' + (applicantName || '') + '）';
      case 'approved': return '承認済（' + (applicantName || '') + '）';
      case 'inactive': return '停止';
      default: return '';
    }
  }

  function getStatusClass(status) {
    switch (status) {
      case '承認待ち': return 'status-pending';
      case '承認済': return 'status-approved';
      case 'キャンセル済み': return 'status-rejected';
      case '否認': return 'status-rejected';
      default: return 'status-deleted';
    }
  }

  function bindModalClose() {
    document.querySelectorAll('[data-close]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        closeModal(btn.dataset.close);
      });
    });
    document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) {
          overlay.hidden = true;
        }
      });
    });
  }

  function closeModal(id) {
    document.getElementById(id).hidden = true;
  }

  function showToast(message, type) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + (type || '');
    toast.hidden = false;
    setTimeout(function () {
      toast.hidden = true;
    }, 3000);
  }

  function showError(err) {
    var msg = typeof err === 'string' ? err : (err && err.message) || 'エラーが発生しました';
    showToast(msg, 'error');
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>
