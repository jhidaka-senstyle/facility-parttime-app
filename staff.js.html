<script>
(function () {
  var facilityCode = '';
  var initData = null;
  var slotsData = [];

  var PREFERRED_SHIFT_OPTIONS = [
    { code: 'FULLDAY', label: '募集どおり終日勤務（8:30-17:30）' },
    { code: 'AM', label: '午前のみ希望（8:30-12:30）' },
    { code: 'PM', label: '午後のみ希望（13:30-17:30）' }
  ];

  document.addEventListener('DOMContentLoaded', function () {
    facilityCode = typeof STAFF_FACILITY_CODE !== 'undefined' ? STAFF_FACILITY_CODE : '';

    document.getElementById('closeApplyModal').addEventListener('click', closeApplyModal);
    document.getElementById('applyForm').addEventListener('submit', onApplySubmit);
    document.getElementById('btnSuccessClose').addEventListener('click', onSuccessClose);
    document.getElementById('applyModal').addEventListener('click', function (e) {
      if (e.target.id === 'applyModal') closeApplyModal();
    });

    if (!facilityCode) {
      showError('所属施設が指定されていません。QRコードからアクセスしてください。');
      return;
    }

    google.script.run
      .withSuccessHandler(onPageDataSuccess)
      .withFailureHandler(function (err) {
        showError(err.message || '読み込みに失敗しました');
      })
      .apiGetStaffPageData(facilityCode);
  });

  function onPageDataSuccess(result) {
    if (!result.success) {
      showError(result.message);
      return;
    }
    initData = result.data;
    document.getElementById('facilityName').textContent = initData.facilityName;
    populateJobTypes();
    populatePreferredShiftOptions();
    slotsData = initData.slots || [];
    document.getElementById('loading').hidden = true;
    renderSlots();
  }

  function populateJobTypes() {
    var select = document.getElementById('applyJobType');
    select.innerHTML = '<option value="">選択してください</option>';
    initData.jobTypes.forEach(function (jt) {
      var opt = document.createElement('option');
      opt.value = jt.code;
      opt.textContent = jt.label;
      select.appendChild(opt);
    });
  }

  function populatePreferredShiftOptions() {
    var select = document.getElementById('applyPreferredShift');
    select.innerHTML = '';
    PREFERRED_SHIFT_OPTIONS.forEach(function (option) {
      var opt = document.createElement('option');
      opt.value = option.code;
      opt.textContent = option.label;
      select.appendChild(opt);
    });
    select.value = 'FULLDAY';
  }

  function isFullDaySlot(slot) {
    return slot && slot.shiftCode === 'FULLDAY';
  }

  function loadSlots() {
    document.getElementById('loading').hidden = false;
    document.getElementById('slotsContainer').hidden = true;
    document.getElementById('emptyView').hidden = true;

    google.script.run
      .withSuccessHandler(function (result) {
        document.getElementById('loading').hidden = true;
        if (!result.success) {
          showError(result.message);
          return;
        }
        slotsData = result.data.slots;
        renderSlots();
      })
      .withFailureHandler(function (err) {
        document.getElementById('loading').hidden = true;
        showError(err.message || '募集の取得に失敗しました');
      })
      .apiGetStaffSlots(facilityCode);
  }

  function renderSlots() {
    var container = document.getElementById('slotsContainer');
    if (!slotsData.length) {
      container.hidden = true;
      document.getElementById('emptyView').hidden = false;
      return;
    }

    var grouped = {};
    slotsData.forEach(function (slot) {
      if (!grouped[slot.workDateKey]) {
        grouped[slot.workDateKey] = { label: slot.workDate, slots: [] };
      }
      grouped[slot.workDateKey].slots.push(slot);
    });

    var html = '';
    Object.keys(grouped).sort().forEach(function (key) {
      var group = grouped[key];
      var shiftTotals = {};
      group.slots.forEach(function (slot) {
        shiftTotals[slot.shiftType] = (shiftTotals[slot.shiftType] || 0) + 1;
      });
      var shiftIndexes = {};

      html += '<div class="date-group">';
      html += '<div class="date-heading">' + escapeHtml(group.label) + '</div>';
      group.slots.forEach(function (slot) {
        shiftIndexes[slot.shiftType] = (shiftIndexes[slot.shiftType] || 0) + 1;
        html += renderSlotCard(slot, {
          index: shiftIndexes[slot.shiftType],
          total: shiftTotals[slot.shiftType]
        });
      });
      html += '</div>';
    });

    container.innerHTML = html;
    container.hidden = false;
    document.getElementById('emptyView').hidden = true;

    container.querySelectorAll('[data-slot-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        openApplyModal(btn.dataset.slotId);
      });
    });
  }

  function renderSlotCard(slot, positionInfo) {
    var multiHint = '';
    if (positionInfo && positionInfo.total > 1) {
      multiHint = '<p class="slot-multi-hint">' + escapeHtml(slot.shiftDisplay) +
        ' 空き枠 ' + positionInfo.index + ' / ' + positionInfo.total + '</p>';
    }

    return (
      '<div class="slot-card">' +
      '<div class="slot-card-top">' +
      '<span class="shift-badge">' + escapeHtml(slot.shiftDisplay) + '</span>' +
      '<span class="remaining-badge">募集中</span>' +
      '</div>' +
      multiHint +
      '<div class="slot-card-body">' +
      '<p><strong>勤務先：</strong>' + escapeHtml(slot.workFacility) + '</p>' +
      '<p><strong>職種条件：</strong>' + escapeHtml(slot.jobCondition) + '</p>' +
      '</div>' +
      '<button type="button" class="btn btn-primary" data-slot-id="' + slot.slotId + '">この枠に応募する</button>' +
      '</div>'
    );
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
  }

  function openApplyModal(slotId) {
    var slot = slotsData.find(function (s) {
      return s.slotId === slotId;
    });
    if (!slot) return;

    document.getElementById('applySlotId').value = slotId;
    document.getElementById('applySlotSummary').innerHTML =
      '<p><strong>勤務日：</strong>' + escapeHtml(slot.workDate) + '</p>' +
      '<p><strong>勤務先：</strong>' + escapeHtml(slot.workFacility) + '</p>' +
      '<p><strong>勤務区分：</strong>' + escapeHtml(slot.shiftDisplay) + '</p>' +
      '<p><strong>職種条件：</strong>' + escapeHtml(slot.jobCondition) + '</p>';

    document.getElementById('applyName').value = '';
    document.getElementById('applyJobType').value = '';
    document.getElementById('applyEmail').value = '';
    document.getElementById('applyRemarks').value = '';

    var preferredGroup = document.getElementById('preferredShiftGroup');
    var preferredSelect = document.getElementById('applyPreferredShift');
    if (isFullDaySlot(slot)) {
      populatePreferredShiftOptions();
      preferredGroup.hidden = false;
      preferredSelect.value = 'FULLDAY';
    } else {
      preferredGroup.hidden = true;
      preferredSelect.value = '';
    }

    document.getElementById('applyModal').hidden = false;
  }

  function closeApplyModal() {
    document.getElementById('applyModal').hidden = true;
  }

  function onApplySubmit(e) {
    e.preventDefault();
    var slotId = document.getElementById('applySlotId').value;
    var name = document.getElementById('applyName').value.trim();
    var jobType = document.getElementById('applyJobType').value;
    var email = document.getElementById('applyEmail').value.trim();
    var remarks = document.getElementById('applyRemarks').value.trim();

    if (!name) {
      alert('氏名を入力してください');
      return;
    }
    if (!jobType) {
      alert('職種を選択してください');
      return;
    }
    if (!email) {
      alert('メールアドレスを入力してください');
      return;
    }
    if (!isValidEmail(email)) {
      alert('メールアドレスの形式が正しくありません');
      return;
    }

    var slot = slotsData.find(function (s) {
      return s.slotId === slotId;
    });
    var preferredShiftType = '';
    if (slot) {
      if (isFullDaySlot(slot)) {
        preferredShiftType = document.getElementById('applyPreferredShift').value;
        if (!preferredShiftType) {
          alert('希望する勤務時間を選択してください');
          return;
        }
      } else if (slot.shiftCode === 'AM') {
        preferredShiftType = 'AM';
      } else if (slot.shiftCode === 'PM') {
        preferredShiftType = 'PM';
      }
    }

    var submitBtn = e.target.querySelector('[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    google.script.run
      .withSuccessHandler(function (result) {
        submitBtn.disabled = false;
        submitBtn.textContent = '応募する';
        if (result.success) {
          closeApplyModal();
          document.getElementById('successMessage').textContent = result.data.message;
          document.getElementById('successModal').hidden = false;
        } else {
          alert(result.message);
        }
      })
      .withFailureHandler(function (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = '応募する';
        alert(err.message || '応募に失敗しました');
      })
      .apiSubmitApplication(facilityCode, slotId, name, jobType, preferredShiftType, remarks, email);
  }

  function onSuccessClose() {
    document.getElementById('successModal').hidden = true;
    loadSlots();
  }

  function showError(message) {
    document.getElementById('loading').hidden = true;
    var el = document.getElementById('errorView');
    el.textContent = message;
    el.hidden = false;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>
